<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>이체 화면 재설계</title>
<style>
  :root {
    --blue: #1B64DA; --blue-deep: #0046FF; --ink: #1A1A1A; --sub: #8A8F98;
    --line: #EDEFF3; --bg: #F2F4F8; --card: #FFFFFF; --chip: #F5F6F9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #DFE3EA; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    display: flex; justify-content: center;
  }
  #phone {
    width: min(390px, 100vw); height: 844px;
    background: #fff; position: relative; overflow: hidden;
    box-shadow: 0 0 0 1px #cfd4dd;
  }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; background: #fff; }
  .screen.on { display: flex; }

  .statusbar {
    height: 44px; flex: 0 0 44px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; font-size: 15px; font-weight: 600;
  }
  .navbar {
    height: 52px; flex: 0 0 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
  }
  .navbar .ico { font-size: 22px; color: #111; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
  .navbar .mid { font-size: 15px; color: var(--blue); font-weight: 600; }

  .body { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .screen-title {
    font-size: 21px;
    font-weight: 700;
    text-align: center;
    margin-top: 20px;
  }
  .input-field {
    margin: 0 20px;
    border: 2px solid var(--blue);
    border-radius: 12px;
    padding: 10px;
    font-size: 18px;
  }
  .input-field input {
    width: calc(100% + 20px);
    border: none;
    outline: none;
    font-size: 18px;
    padding: 5px 10px;
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin: 20px;
  }
  .keypad button {
    background: #fff;
    border: 1px solid #dcdcdc;
    height: 60px;
    font-size: 20px;
    font-family: inherit;
    color: #111;
  }
  .btn-next {
    margin: 10px 20px;
    background: var(--blue-deep);
    color: #fff;
    border: 0;
    border-radius: 12px;
    padding: 15px;
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
  }
  .bank-list {
    margin: 0 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 19px;
    color: var(--ink);
  }
</style>
</head>
<body>
<div id="phone">

<!-- ================= 1. 시작 ================= -->
<section class="screen on" data-screen="start">
  <div class="statusbar"><span>1:39</span><span class="right">5G 66</span></div>
  <div class="navbar">
    <span class="ico" data-action="go-main">⌂</span>
    <span class="mid">이체 시작</span>
    <span class="ico"></span>
  </div>
  <div class="body">
    <div class="screen-title">이체를 시작합니다</div>
    <button class="btn-next" data-action="go-recipient">받는 사람 선택</button>
  </div>
</section>

<!-- ================= 2. 받는 사람 ================= -->
<section class="screen" data-screen="recipient">
  <div class="statusbar"><span>1:40</span><span class="right">5G 66</span></div>
  <div class="navbar">
    <span class="ico" data-action="back-start">‹</span>
    <span class="mid">받는 사람 선택</span>
    <span class="ico"></span>
  </div>
  <div class="body">
    <div class="screen-title">계좌번호를 입력해주세요</div>
    <div class="input-field">
      <input type="number" data-action="acc-input" placeholder="계좌번호 입력" value="">
    </div>
    <button class="btn-next" data-action="go-bank">은행 선택</button>
  </div>
</section>

<!-- ================= 3. 은행 선택 ================= -->
<section class="screen" data-screen="bank">
  <div class="statusbar"><span>1:41</span><span class="right">5G 66</span></div>
  <div class="navbar">
    <span class="ico" data-action="back-recipient">‹</span>
    <span class="mid">은행 선택</span>
    <span class="ico"></span>
  </div>
  <div class="body">
    <div class="screen-title">은행을 선택해주세요</div>
    <div class="bank-list" data-action="pick-bank">카카오뱅크</div>
    <div class="bank-list" data-action="pick-bank">신한은행</div>
    <div class="bank-list" data-action="pick-bank">우리은행</div>
    <div class="bank-list" data-action="pick-bank">하나은행</div>
    <!-- 은행 목록은 계속 추가 -->
    <button class="btn-next" data-action="go-amount">금액 입력</button>
  </div>
</section>

<!-- ================= 4. 금액 입력 ================= -->
<section class="screen" data-screen="amount">
  <div class="statusbar"><span>1:42</span><span class="right">5G 66</span></div>
  <div class="navbar">
    <span class="ico" data-action="back-bank">‹</span>
    <span class="mid">금액 입력</span>
    <span class="ico"></span>
  </div>
  <div class="body">
    <div class="screen-title">이체 금액을 입력해주세요</div>
    <div class="input-field">
      <input type="number" data-action="amt-input" placeholder="금액 입력" value="">
    </div>
    <div class="quick">
      <button data-action="quick" data-v="10000">+1만</button>
      <button data-action="quick" data-v="50000">+5만</button>
      <button data-action="quick" data-v="100000">+10만</button>
      <button data-action="quick" data-v="all">전액</button>
    </div>
    <button class="btn-next" data-action="go-confirm">확인</button>
  </div>
</section>

<!-- ================= 5. 최종 확인 ================= -->
<section class="screen" data-screen="confirm">
  <div class="statusbar"><span>1:43</span><span class="right">5G 66</span></div>
  <div class="navbar">
    <span class="ico" data-action="back-amount">‹</span>
    <span class="mid">확인</span>
    <span class="ico"></span>
  </div>
  <div class="body">
    <div class="screen-title">이체 내용을 확인해주세요</div>
    <div class="summary">
      <div class="srow"><span class="k">받는 계좌</span><span id="cf-acc">카카오뱅크 3333000000000</span></div>
      <div class="srow"><span class="k">금액</span><span id="cf-amt">10,000원</span></div>
      <!-- 추가 내용들 -->
    </div>
    <button class="btn-next" data-action="go-password">보내기</button>
  </div>
</section>

<!-- ================= 6. 비밀번호 입력 ================= -->
<section class="screen" data-screen="password">
  <div class="statusbar"><span>1:44</span><span class="right">5G 66</span></div>
  <div class="navbar">
    <span class="ico" data-action="back-confirm">‹</span>
    <span class="mid">비밀번호 입력</span>
    <span class="ico"></span>
  </div>
  <div class="body">
    <div class="screen-title">계좌 비밀번호를 입력해주세요</div>
    <div class="dots" id="pw-dots">
      <i class="cur"></i><i></i><i></i><i></i>
    </div>
    <div class="keypad" id="pwpad">
      <button data-action="pw" data-v="1">1</button><button data-action="pw" data-v="2">2</button><button data-action="pw" data-v="3">3</button>
      <button data-action="pw" data-v="4">4</button><button data-action="pw" data-v="5">5</button><button data-action="pw" data-v="6">6</button>
      <button data-action="pw" data-v="7">7</button><button data-action="pw" data-v="8">8</button><button data-action="pw" data-v="9">9</button>
      <button class="sm" data-action="pw-shuffle">재배열</button>
      <button data-action="pw" data-v="0">0</button>
      <button data-action="pw-del">⌫</button>
    </div>
  </div>
</section>

<!-- ================= 7. 완료 ================= -->
<section class="screen" data-screen="done">
  <div class="statusbar"><span>1:45</span><span class="right">5G 66</span></div>
  <div class="body">
    <div class="okwrap">
      <div class="okc">✓</div>
      <div class="q2">이체가 완료되었습니다.</div>
      <div class="q2"><span id="dn-amt">10,000</span>원을 보냈습니다.</div>
      <div class="okbtns"><button>추가이체</button><button>상세보기</button></div>
    </div>
  </div>
  <div class="bottom2"><button class="ghost">공유</button><button class="fill" data-action="finish">확인</button></div>
</section>

</div>

<script>
/* ============ 상태 ============ */
const S = { bank: '', account: '', amount: '', pw: '' };

/* ============ 화면 전환 ============ */
function show(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.dataset.screen === name));
  log('screen_enter', { to: name });
  window.scrollTo(0, 0);
}
window.__screen = () => window.__task.screen;

/* ============ 동작 ============ */
document.getElementById('phone').addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;

  if (a === 'go-main') show('start');
  else if (a === 'go-recipient') show('recipient');
  else if (a === 'back-start') show('start');
  else if (a === 'go-bank') show('bank');
  else if (a === 'back-recipient') show('recipient');
  else if (a === 'pick-bank') {
    S.bank = el.textContent.trim();
    log('pick_bank', { bank: S.bank });
    show('amount');
  }
  else if (a === 'go-amount') show('amount');
  else if (a === 'back-bank') show('bank');
  else if (a === 'back-amount') show('amount');
  else if (a === 'go-confirm') {
    document.getElementById('cf-acc').textContent = `${S.bank} ${S.account}`;
    document.getElementById('cf-amt').textContent = `${Number(S.amount).toLocaleString()}원`;
    show('confirm');
  }
  else if (a === 'go-password') show('password');
  else if (a === 'back-confirm') show('confirm');
  else if (a === 'finish') show('start');
  else if (a === 'acc-input') S.account = el.value;
  else if (a === 'amt-input') S.amount = el.value;
  else if (a === 'pw') S.pw += el.dataset.v;
  else if (a === 'pw-del') S.pw = S.pw.slice(0, -1);
  else if (a === 'pw-shuffle') document.getElementById('pwpad').innerHTML = Array.from({ length: 10 }, (_, i) => i).sort(() => Math.random() - 0.5).map(n => `<button data-action="pw" data-v="${n}">${n}</button>`).join('');
  else if (a === 'quick') S.amount = String(Number(S.amount) + Number(el.dataset.v));
});

log('screen_enter', { to: 'start' });
</script>
</body>
</html>
