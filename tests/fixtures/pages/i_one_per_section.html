<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>분류마다 항목 하나</title>
<style>
  body { margin: 0; font-family: sans-serif; color: #111; background: #fff; }
  #phone { width: 390px; }
  .screen { display: none; padding: 16px; }
  .screen.on { display: block; }
  .sec { margin: 8px 0; }
  button { font-size: 18px; color: #111; background: #fff; border: 1px solid #111; }
</style>
</head>
<body>
<div id="phone">
<!-- 도구가 넣는 데이터 블록과 같은 모양. 검사 I 는 이 블록을 증거로 세지 않는다 -
     그래서 항목 값은 DOM 에서만 찾을 수 있다. -->
<script id="preserved-data">window.PRESERVED = {"ITEMS": ["계좌이체", "납부하기", "자동납부", "환전"]};</script>
<section class="screen on" data-screen="menu">
  <button data-action="back">뒤로</button>
  <div id="secs"></div>
  <button data-action="more" id="more">더 보기</button>
</section>
<section class="screen" data-screen="done">
  <button data-action="back">뒤로</button>
  <p>보냈습니다 <span id="dn-amt">10,000</span>원</p>
</section>
<script>
/* 분류마다 목록을 따로 만들고, 분류에는 항목이 하나뿐이다 - 같은 data-action 의
   형제가 없다. [더 보기] 를 누르면 남은 분류를 같은 모양으로 더 그린다. */
const P = window.PRESERVED;
function draw(n) {
  document.getElementById('secs').innerHTML = P.ITEMS.slice(0, n).map(function (v) {
    return '<div class="sec"><h3>분류</h3><button data-action="menu-item" data-item="' + v + '">' + v + '</button></div>';
  }).join('');
}
function show(name) {
  document.querySelectorAll('.screen').forEach(function (s) {
    s.classList.toggle('on', s.dataset.screen === name);
  });
}
draw(2);
window.__screen = function () { return document.querySelector('.screen.on').dataset.screen; };
document.getElementById('phone').addEventListener('click', function (e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'more') { draw(4); }
  else if (a === 'menu-item') { show('done'); }
  else if (a === 'back') { show('menu'); }
});
</script>
</div>
</body>
</html>
