<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>검사 A - 기록만 넘어가고 화면은 그대로다</title>
<style>
  body{background:#fff; color:#111; font-size:18px; margin:0; padding:16px;}
  .screen{display:none;}
  .screen.on{display:block;}
  button{background:#F1F3F7; color:#111; border:0; padding:12px; font-size:18px;}
</style>
</head>
<body>
<!-- '보내기' 를 누르면 __task.screen 만 'done' 이 된다. on 클래스를 옮기지
     않으므로 사용자가 보고 있는 화면은 그대로 start 다. window.__screen() 하나만
     믿는 검사기는 완료 화면에 도착했다고 판정한다. -->
<section class="screen on" data-screen="start" id="start">
  <p id="amt">10,000원</p>
  <button data-action="go-done">보내기</button>
</section>
<section class="screen" data-screen="done" id="done">
  <p>보냈습니다</p>
</section>
<script>
window.__task = {screen: 'start'};
window.__screen = () => window.__task.screen;
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'go-done') {
    window.__task.screen = 'done';   // 기록만 바꾼다 - on 클래스는 그대로다
  }
});
</script>
</body>
</html>
