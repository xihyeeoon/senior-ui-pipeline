<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>검사 B - 장식과 라벨이 붙은 값은 통과해야 한다</title>
<style>
  body{background:#fff; color:#111; font-size:18px; margin:0; padding:16px;}
  .screen{display:none;}
  .screen.on{display:block;}
  small{display:block; font-size:16px; color:#333;}
  button{background:#F1F3F7; color:#111; border:0; padding:12px; font-size:18px;}
</style>
</head>
<body>
<!-- 과제가 넣은 값 그대로인데 모양만 다른 것들. 전부 통과해야 한다.

     위의 둘은 장식이다 - 금액 뒤의 단위, 계좌를 끊어 읽는 하이픈.
     아래 셋은 한 요소가 라벨과 값을 같이 담은 것이고, Run1~3 에 실제로 있는
     모양을 그대로 옮겨 놓은 것이다.

       #rv-acc  계좌 앞에 은행 이름        (Run1 · Run3)
       #rv-amt  금액 아래 한글 읽기(small) (Run1 · Run3)
       #am-acc  은행 이름 뒤에 끊어 쓴 계좌 (Run2, 기대값은 은행 이름)
-->
<section class="screen on" data-screen="start" id="start">
  <p id="dn-amt">10,000원</p>
  <p id="acc">3333-0000-0000-0</p>
  <p id="rv-acc">카카오뱅크 3333000000000</p>
  <p id="rv-amt">10,000원<small id="rv-amt-kor">만 원</small></p>
  <p id="am-acc">카카오뱅크 3333 0000 0000 0</p>
  <button data-action="noop">확인</button>
</section>
<script>
window.__task = {screen: 'start'};
window.__screen = () => window.__task.screen;
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'noop') { /* 이 페이지는 걷지 않는다 */ }
});
</script>
</body>
</html>
