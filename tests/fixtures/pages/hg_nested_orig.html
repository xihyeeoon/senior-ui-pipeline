<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>검사 H·G - 중첩 블록이 없는 원본</title>
<style>
  body{background:#fff; color:#111; font-size:18px; margin:0; padding:16px;}
  .screen{display:none;}
  .screen.on{display:block;}
  .chip{background:#F1F3F7; color:#111; padding:8px;}
  @media (max-width: 480px) {
    .chip.on{background:#0046FF; color:#fff;}
  }
  button{background:#F1F3F7; color:#111; border:0; padding:12px; font-size:18px;}
</style>
</head>
<body>
<!-- 고른 것과 안 고른 것이 아직 다르게 보인다. 빌드 쪽에서 그 구분이 무너진다. -->
<section class="screen on" data-screen="start" id="start">
  <p class="chip">안 고름</p>
  <p class="chip on">고름</p>
  <p id="amt">10,000원</p>
  <div><button data-action="noop">확인</button></div>
</section>
<script>
window.__task = {screen: 'start'};
window.__screen = () => window.__task.screen;
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'noop') { /* 이 페이지는 걷지 않는다 */ }
});
</script>
</body>
</html>
