<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>검사 D - 이름만 같은 원본 화면</title>
<style>
  body{background:#fff; color:#111; font-size:18px; margin:0; padding:16px;}
  .screen{display:none;}
  .screen.on{display:block;}
  button{background:#F1F3F7; color:#111; border:0; padding:12px; font-size:18px;}
</style>
</head>
<body>
<!-- '시작' 이라는 화면 이름과 클래스 하나를 빌드와 공유하지만 전혀 다른
     화면이다. 그 클래스는 장식 기호 하나를 담은 저대비 요소다. -->
<section class="screen on" data-screen="start" id="start">
  <p class="st" style="color:#c9c9c9">☆</p>
  <p id="amt" style="color:#111">10,000원</p>
  <div><button data-action="noop" style="color:#111">확인</button></div>
</section>
<script>
window.__task = {screen: 'start'};
window.__screen = () => window.__task.screen;
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'noop') { /* 이 페이지는 걷지 않는다 */ }
});
</script>
</body>
</html>
